name: Deploy GitHub Pages

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Pages artifact
    runs-on: ubuntu-latest
    steps:
      - name: Check out the deployment commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image decoder
        run: python -m pip install --disable-pip-version-check pillow==12.2.0

      - name: Test deployment boundary
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Stage manifest-owned files
        run: python scripts/stage_pages_artifact.py --site-root . --output _site

      - name: Validate every staged image surface
        run: >-
          python scripts/site_image_validator.py
          --site-root _site
          --site-url https://cheesss.github.io/counterfactual-seed-generator-blog
          --manifest _site/image-manifest.json

      - name: Verify full release or baseline-preserving selected repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f _site/.publication-update.json ]; then
            python scripts/static_update_baseline.py --site-root _site --baseline-repo .
          else
            python scripts/site_release_validator.py --site-root _site --baseline-repo .
          fi

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload validated Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy validated Pages artifact
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    name: Verify live site bytes
    # Read-only: fetch the deployed files and compare them with the manifest.
    # Retries cover CDN propagation (about 10 minutes at most).
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the deployed commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compare live bytes with the deployed manifest
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          BEFORE_SHA: ${{ github.event.before }}
        run: >-
          python scripts/verify_live.py
          --site-url "$PAGE_URL"
          --before "$BEFORE_SHA"
          --after "$GITHUB_SHA"
          --max-wait 600
