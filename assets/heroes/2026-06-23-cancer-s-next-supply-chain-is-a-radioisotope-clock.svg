<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Abstract bottleneck diagram for Cancer&#x27;s Next Supply Chain Is a Radioisotope Clock">
  <style>
    .bg { fill: #f5f3ee; }
    .ink { fill: #243c5a; }
    .accent { fill: #b94d4d; }
    .accent2 { fill: #5f9ea0; }
    .line { stroke: #243c5a; stroke-width: 3; opacity: 0.22; fill: none; }
    .dash { stroke: #b94d4d; stroke-width: 6; stroke-linecap: round; fill: none; }
    .title { fill: #243c5a; font-family: Georgia, 'Times New Roman', serif; font-size: 52px; font-weight: 700; }
    .eyebrow { fill: #b94d4d; font-family: Arial, sans-serif; font-size: 26px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; }
    .sub { fill: #243c5a; font-family: Arial, sans-serif; font-size: 27px; opacity: 0.72; }
    .chip { fill: rgba(255,255,255,0.48); stroke: #243c5a; stroke-width: 2; opacity: 0.82; }
    .chip-text { fill: #243c5a; font-family: Arial, sans-serif; font-size: 19px; font-weight: 700; }
  </style>
  <rect class="bg" width="1600" height="900"/>

  <rect x="1070" y="452" width="300" height="66" rx="10" class="ink" opacity="0.82"/>
  <rect x="1092" y="376" width="300" height="66" rx="10" class="accent" opacity="0.92"/>
  <rect x="1114" y="300" width="300" height="66" rx="10" class="accent2" opacity="0.92"/>
  <circle cx="1392" cy="252" r="58" fill="none" class="line" style="stroke-width:9;opacity:0.9"/>
  <path d="M1366 252 l18 20 l34 -42" fill="none" class="dash" style="stroke-width:11"/>
  <text x="120" y="118" class="eyebrow">BOTTLENECK BRIEFS</text>
  <text x="120" y="190" class="title">Cancer&#x27;s Next Supply Chain</text>
<text x="120" y="248" class="title">Is a Radioisotope Clock</text>
  <text x="120" y="575" class="sub">Healthcare / Qualified materials &amp; supply</text>
  <g transform="translate(120,660)"><rect width="285" height="48" rx="8" class="chip"/><text x="142.5" y="31" class="chip-text" text-anchor="middle">Qualified supply</text></g>
<g transform="translate(435,660)"><rect width="285" height="48" rx="8" class="chip"/><text x="142.5" y="31" class="chip-text" text-anchor="middle">Healthcare</text></g>
<g transform="translate(750,660)"><rect width="285" height="48" rx="8" class="chip"/><text x="142.5" y="31" class="chip-text" text-anchor="middle">Evidence map</text></g>
