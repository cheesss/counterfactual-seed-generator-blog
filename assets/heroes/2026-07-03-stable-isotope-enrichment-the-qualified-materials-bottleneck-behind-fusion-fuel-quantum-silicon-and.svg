    .line { stroke: #2f342d; stroke-width: 3; opacity: 0.22; fill: none; }
    .dash { stroke: #8bb7a3; stroke-width: 6; stroke-linecap: round; fill: none; }
    .title { fill: #2f342d; font-family: Georgia, 'Times New Roman', serif; font-size: 52px; font-weight: 700; }
    .eyebrow { fill: #8bb7a3; font-family: Arial, sans-serif; font-size: 26px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; }
    .sub { fill: #2f342d; font-family: Arial, sans-serif; font-size: 27px; opacity: 0.72; }
    .chip { fill: rgba(255,255,255,0.48); stroke: #2f342d; stroke-width: 2; opacity: 0.82; }
    .chip-text { fill: #2f342d; font-family: Arial, sans-serif; font-size: 19px; font-weight: 700; }
  </style>
