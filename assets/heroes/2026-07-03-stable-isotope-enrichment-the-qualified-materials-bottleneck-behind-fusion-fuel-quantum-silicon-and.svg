<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Abstract bottleneck diagram for Stable-Isotope Enrichment: The Qualified-Materials Bottleneck Behind Fusion Fuel, Quantum Silicon, and Radioligands">
  <style>
