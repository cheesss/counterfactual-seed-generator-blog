  <rect x="1070" y="452" width="300" height="66" rx="10" class="ink" opacity="0.82"/>
  <rect x="1092" y="376" width="300" height="66" rx="10" class="accent" opacity="0.92"/>
  <rect x="1114" y="300" width="300" height="66" rx="10" class="accent2" opacity="0.92"/>
  <circle cx="1392" cy="252" r="58" fill="none" class="line" style="stroke-width:9;opacity:0.9"/>
  <path d="M1366 252 l18 20 l34 -42" fill="none" class="dash" style="stroke-width:11"/>
  <text x="120" y="118" class="eyebrow">BOTTLENECK BRIEFS</text>
  <text x="120" y="190" class="title">Stable-Isotope Enrichment:</text>
<text x="120" y="248" class="title">The Qualified-Materials</text>
<text x="120" y="306" class="title">Bottleneck Behind Fusion</text>
<text x="120" y="364" class="title">Fuel,...</text>
  <text x="120" y="575" class="sub">Nuclear &amp; fusion / Qualified materials &amp; supply</text>
